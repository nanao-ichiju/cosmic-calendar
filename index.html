<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="宇宙暦">
<meta name="theme-color" content="#06090f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>宇宙暦カレンダー</title>
<link id="fontLink" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;600&family=Noto+Sans+JP:wght@200;300;400&family=IM+Fell+English:ital@0;1&family=Kaisei+Decol:wght@400;700&family=M+PLUS+Rounded+1c:wght@300;400;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   THEME SYSTEM
══════════════════════════════════════ */
:root {
  --bg:#06090f;--bg2:#0b1018;--bg3:#101825;
  --gold:#c8a84b;--gold-l:#e8d080;--gold-d:#7a6428;
  --silver:#a0b0c4;--moon:#f2eada;--text:#ddd8ce;--dim:#8090a4;
  --red:#c05050;--red-l:#f0a0a0;--green:#4a9468;--green-l:#90d8b0;
  --blue:#4a6ab8;--blue-l:#90b0e8;--purple:#7858a8;--purple-l:#c0a0e8;
  --cell-bg:rgba(11,16,24,.7);--border:rgba(200,168,75,.15);
  --tag-size:9px;--day-size:16px;--body-font:'Noto Sans JP',sans-serif;
  --display-font:'Cinzel',serif;--r:16px;
  --gate-bg:rgba(120,88,168,.15);--gate-border:rgba(120,88,168,.5);
  --gate-glow:rgba(120,88,168,.3);
}

/* ── 無料テーマ ── */
[data-theme="white"] {
  --bg:#f4f0e8;--bg2:#ede8dc;--bg3:#e4ddd0;
  --gold:#8a6a20;--gold-l:#6a5010;--gold-d:#c8a84b;
  --moon:#2a2010;--text:#3a3020;--dim:#8a8070;
  --cell-bg:rgba(255,252,245,.8);--border:rgba(138,106,32,.2);
}
[data-theme="sumi"] {
  --bg:#0a0806;--bg2:#120e0a;--bg3:#1a1410;
  --gold:#cc4422;--gold-l:#ff6644;--gold-d:#882211;
  --moon:#e8e0d0;--text:#c8c0b0;--dim:#706860;
  --cell-bg:rgba(18,14,10,.8);--border:rgba(204,68,34,.2);
}

/* ── 有料テーマ ── */
[data-theme="sakura"] {
  --bg:#1a0810;--bg2:#240c18;--bg3:#2e1020;
  --gold:#e890b0;--gold-l:#ffb8d0;--gold-d:#c06080;
  --moon:#fff0f4;--text:#f0d0dc;--dim:#b08090;
  --cell-bg:rgba(36,12,24,.8);--border:rgba(232,144,176,.2);
  --gate-bg:rgba(200,80,120,.15);--gate-border:rgba(200,80,120,.5);
}
[data-theme="umi"] {
  --bg:#020e1a;--bg2:#041420;--bg3:#061a2a;
  --gold:#40c0e0;--gold-l:#80e0f8;--gold-d:#208090;
  --moon:#e0f4ff;--text:#c0ddf0;--dim:#507080;
  --cell-bg:rgba(4,20,32,.8);--border:rgba(64,192,224,.2);
  --gate-bg:rgba(32,128,160,.15);--gate-border:rgba(32,128,160,.5);
}
[data-theme="ajisai"] {
  --bg:#0e0818;--bg2:#140c22;--bg3:#1a102c;
  --gold:#9060d0;--gold-l:#c090ff;--gold-d:#6040a0;
  --moon:#f0e8ff;--text:#d8c8f0;--dim:#806898;
  --cell-bg:rgba(20,12,34,.8);--border:rgba(144,96,208,.2);
}
[data-theme="koyo"] {
  --bg:#180804;--bg2:#200c06;--bg3:#2a1008;
  --gold:#e06820;--gold-l:#ff9040;--gold-d:#a04010;
  --moon:#fff0e0;--text:#f0d8c0;--dim:#907060;
  --cell-bg:rgba(32,12,6,.8);--border:rgba(224,104,32,.2);
}
[data-theme="yuki"] {
  --bg:#0a0e14;--bg2:#0e1420;--bg3:#141c2c;
  --gold:#90b8e0;--gold-l:#c0d8f8;--gold-d:#6090b8;
  --moon:#f0f8ff;--text:#d0e4f8;--dim:#708090;
  --cell-bg:rgba(14,20,32,.8);--border:rgba(144,184,224,.2);
}
[data-theme="uchu"] {
  --bg:#04000e;--bg2:#080018;--bg3:#0c0022;
  --gold:#e040ff;--gold-l:#ff80ff;--gold-d:#a020cc;
  --moon:#fff0ff;--text:#e8d0ff;--dim:#806090;
  --cell-bg:rgba(8,0,24,.8);--border:rgba(224,64,255,.2);
  --gate-bg:rgba(180,0,220,.2);--gate-border:rgba(220,64,255,.6);
}
[data-theme="anime"] {
  --bg:#0a1428;--bg2:#0e1c38;--bg3:#122448;
  --gold:#ffcc00;--gold-l:#ffe066;--gold-d:#cc9900;
  --moon:#ffffff;--text:#e8f0ff;--dim:#8090b8;
  --cell-bg:rgba(14,28,56,.8);--border:rgba(255,204,0,.25);
  --gate-bg:rgba(255,100,0,.15);--gate-border:rgba(255,180,0,.6);
}
[data-theme="pop"] {
  --bg:#1a0a2e;--bg2:#220e3a;--bg3:#2c1248;
  --gold:#ff6eb4;--gold-l:#ffaadd;--gold-d:#cc4488;
  --moon:#fff8ff;--text:#f8e0f8;--dim:#b080b0;
  --cell-bg:rgba(34,14,58,.8);--border:rgba(255,110,180,.25);
  --gate-bg:rgba(255,80,160,.15);--gate-border:rgba(255,120,200,.6);
}
[data-theme="mizutama"] {
  --bg:#f8f4ff;--bg2:#f0eaff;--bg3:#e8deff;
  --gold:#7040c0;--gold-l:#5020a0;--gold-d:#9060e0;
  --moon:#2a1060;--text:#3a2070;--dim:#9080b0;
  --cell-bg:rgba(255,255,255,.7);--border:rgba(112,64,192,.2);
  --gate-bg:rgba(160,80,255,.1);--gate-border:rgba(160,80,255,.4);
}

/* ── フォント ── */
[data-font="modern"] {
  --display-font:'M PLUS Rounded 1c',sans-serif;
  --body-font:'M PLUS Rounded 1c',sans-serif;
}
[data-font="wa"] {
  --display-font:'Kaisei Decol',serif;
  --body-font:'Kaisei Decol',serif;
}

/* ══════════════════════════════════════
   BASE
══════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--body-font);font-weight:300;font-size:14px;transition:background .4s,color .4s;}

#stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
.app{position:relative;z-index:1;max-width:430px;margin:0 auto;padding-bottom:88px;}
.page{display:none;position:relative;z-index:1;max-width:430px;margin:0 auto;padding-bottom:88px;}
.page.active{display:block;}

/* ══ ヘッダー ══ */
.hdr{padding:20px 18px 10px;text-align:center;}
.hdr-eyebrow{font-family:var(--display-font);font-size:9px;letter-spacing:5px;color:var(--gold-d);margin-bottom:6px;}
.month-nav{display:flex;align-items:center;justify-content:center;gap:20px;}
.nav-btn{background:none;border:1px solid rgba(200,168,75,.25);color:var(--gold);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;}
.nav-btn:active{background:rgba(200,168,75,.15);}
.month-txt .m{font-family:var(--display-font);font-size:26px;color:var(--moon);letter-spacing:1px;}
.month-txt .y{font-size:11px;color:var(--dim);letter-spacing:3px;margin-top:1px;}

/* ══ バナー ══ */
.banner{margin:8px 14px;background:linear-gradient(135deg,rgba(16,24,37,.95),rgba(10,16,24,.95));border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;}
.banner::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(200,168,75,.06) 0%,transparent 70%);}
.banner-icon{font-size:42px;filter:drop-shadow(0 0 12px rgba(242,234,218,.3));z-index:1;}
.banner-info{z-index:1;}
.banner-info h3{font-family:var(--display-font);font-size:15px;color:var(--moon);font-weight:400;}
.banner-info p{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.5;}
.banner-age{margin-left:auto;text-align:right;z-index:1;}
.banner-age .n{font-family:var(--display-font);font-size:30px;color:var(--gold);line-height:1;}
.banner-age .u{font-size:10px;color:var(--dim);}

/* ══ ゲートバナー ══ */
.gate-banner{margin:6px 14px;border-radius:var(--r);padding:11px 16px;display:flex;align-items:center;gap:10px;font-size:12px;border:1px solid var(--gate-border);background:var(--gate-bg);box-shadow:0 0 16px var(--gate-glow);}
.gate-icon{font-size:22px;filter:drop-shadow(0 0 6px var(--gate-glow));}
.gate-info b{color:var(--moon);font-weight:400;font-size:13px;}
.gate-info span{color:var(--dim);font-size:10px;display:block;margin-top:1px;}

/* ══ カレンダー ══ */
.cal-wrap{margin:10px 14px;background:var(--cell-bg);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.wday{display:grid;grid-template-columns:repeat(7,1fr);background:rgba(0,0,0,.3);padding:8px 0 6px;}
.wday span{text-align:center;font-size:11px;letter-spacing:.5px;color:var(--dim);font-weight:400;}
.wday span:first-child{color:rgba(220,100,100,.8);}
.wday span:last-child{color:rgba(100,140,220,.8);}
.grid{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 2px 6px;row-gap:1px;position:relative;}

/* ゲート帯（行またぎ対応） */
.gate-row-bar{
  position:absolute;height:calc(100%/6 - 4px);
  background:var(--gate-bg);
  border-top:1px solid var(--gate-border);
  border-bottom:1px solid var(--gate-border);
  pointer-events:none;z-index:0;
  box-shadow:inset 0 0 12px var(--gate-glow);
  border-radius:4px;
}

.dc{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:3px 1px 4px;min-height:62px;cursor:pointer;border-radius:10px;transition:.15s;}
.dc:active{background:rgba(200,168,75,.1);}
.dc.empty{pointer-events:none;}

/* ゲート期間セル */
.dc.gate-day{background:var(--gate-bg);}
.dc.gate-start{border-left:2px solid var(--gate-border);border-radius:10px 0 0 10px;}
.dc.gate-end{border-right:2px solid var(--gate-border);border-radius:0 10px 10px 0;}

/* ピーク日 */
.dc.peak-day{
  background:linear-gradient(135deg,var(--gate-bg),rgba(200,168,75,.1));
  border:1px solid var(--gold);
  box-shadow:0 0 12px var(--gate-glow),0 0 6px rgba(200,168,75,.2);
}
.dc.peak-day .dn{color:var(--gold-l) !important;}

/* 今日 */
.dc.today .dn{
  background:var(--gold);color:var(--bg) !important;
  border-radius:50%;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  font-weight:600;box-shadow:0 0 8px rgba(200,168,75,.4);
}
.dc.selected{background:rgba(200,168,75,.1);}
.dc.selected .dn{color:var(--gold) !important;}

.dn{font-family:var(--display-font);font-size:var(--day-size);width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--text);}
.dc:nth-child(7n+1) .dn{color:#e09090;}
.dc:nth-child(7n) .dn{color:#90a8e0;}

/* 旧暦 */
.kyureki{font-size:8px;color:var(--dim);line-height:1;margin-top:0px;font-family:var(--body-font);}

/* 月相 */
.moon-sm{font-size:15px;line-height:1;margin-top:1px;filter:drop-shadow(0 0 3px rgba(242,234,218,.2));}
.moon-sm.dim{font-size:9px;color:rgba(200,200,180,.25);}
.moon-sm.near{font-size:12px;opacity:.6;}

/* タグ */
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;margin-top:2px;}
.tg{font-size:var(--tag-size);padding:2px 4px;border-radius:4px;letter-spacing:.3px;white-space:nowrap;font-weight:400;}
.tg-g{background:rgba(200,168,75,.3);color:var(--gold-l);border:1px solid rgba(200,168,75,.3);}
.tg-r{background:rgba(192,80,80,.28);color:#ffb0b0;border:1px solid rgba(192,80,80,.3);}
.tg-gr{background:rgba(74,148,104,.28);color:#a0f0c0;border:1px solid rgba(74,148,104,.3);}
.tg-b{background:rgba(74,106,184,.28);color:#a0c0ff;border:1px solid rgba(74,106,184,.3);}
.tg-p{background:rgba(120,88,168,.3);color:var(--purple-l);border:1px solid rgba(120,88,168,.3);}

/* ゲート矢印バー */
.gate-arrow-bar{
  margin:0 14px 6px;
  border-radius:8px;padding:7px 12px;
  display:flex;align-items:center;gap:8px;
  font-size:11px;
  background:var(--gate-bg);
  border:1px solid var(--gate-border);
  box-shadow:0 0 10px var(--gate-glow);
}
.gab-arrow{color:var(--gold);font-size:13px;flex-shrink:0;}
.gab-line{flex:1;height:2px;background:linear-gradient(90deg,var(--gate-border),var(--gold),var(--gate-border));border-radius:1px;position:relative;}
.gab-peak{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--gold);white-space:nowrap;}
.gab-dates{font-size:10px;color:var(--dim);white-space:nowrap;}

/* ══ 詳細パネル ══ */
.panel{margin:10px 14px;background:linear-gradient(160deg,rgba(12,18,28,.97),rgba(8,12,18,.97));border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.panel-head{padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px;}
.panel-date{font-family:var(--display-font);font-size:28px;color:var(--moon);line-height:1;}
.panel-date-sub{font-size:11px;color:var(--dim);margin-top:2px;}
.panel-moon{font-size:32px;filter:drop-shadow(0 0 8px rgba(242,234,218,.25));}
.panel-moon-info{margin-left:auto;text-align:right;}
.panel-moon-info .mn{font-family:var(--display-font);font-size:14px;color:var(--moon);}
.panel-moon-info .ma{font-size:11px;color:var(--dim);margin-top:2px;}
.psec{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);}
.psec:last-child{border-bottom:none;}
.psec-label{font-size:9px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;margin-bottom:8px;}
.day-cards{display:flex;flex-direction:column;gap:8px;}
.day-card{border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;}
.day-card.good{background:rgba(200,168,75,.08);border:1px solid rgba(200,168,75,.25);}
.day-card.caution{background:rgba(192,80,80,.08);border:1px solid rgba(192,80,80,.25);}
.day-card.neutral{background:rgba(96,104,120,.08);border:1px solid rgba(96,104,120,.2);}
.day-card.gate{background:var(--gate-bg);border:1px solid var(--gate-border);}
.day-card.astro{background:rgba(74,106,184,.08);border:1px solid rgba(74,106,184,.25);}
.day-card.personal{background:rgba(74,148,104,.08);border:1px solid rgba(74,148,104,.3);}
.dc-icon{font-size:22px;flex-shrink:0;margin-top:1px;}
.dc-name{font-size:13px;color:var(--moon);font-weight:400;margin-bottom:4px;}
.dc-desc{font-size:11px;color:var(--dim);line-height:1.7;margin-bottom:6px;}
.dc-actions{display:flex;flex-direction:column;gap:4px;}
.dc-do,.dc-dont{font-size:10px;padding:5px 8px;border-radius:6px;display:flex;align-items:flex-start;gap:5px;line-height:1.5;}
.dc-do{background:rgba(74,148,104,.15);color:#a0e8c0;}
.dc-dont{background:rgba(192,80,80,.12);color:#ffb0b0;}
.dc-do::before{content:'✓';flex-shrink:0;font-weight:bold;}
.dc-dont::before{content:'✗';flex-shrink:0;font-weight:bold;}
.maya-row{display:flex;gap:10px;}
.maya-card{flex:1;background:rgba(120,88,168,.1);border:1px solid rgba(120,88,168,.25);border-radius:10px;padding:10px;text-align:center;}
.maya-card .mi{font-size:22px;margin-bottom:4px;}
.maya-card .ml{font-size:9px;color:var(--dim);letter-spacing:1px;margin-bottom:3px;}
.maya-card .mv{font-size:12px;color:var(--purple-l);}
.maya-card .mk{font-size:10px;color:var(--text);margin-top:4px;line-height:1.5;text-align:left;}
.full-moon-name{background:linear-gradient(135deg,rgba(242,234,218,.08),rgba(200,168,75,.05));border:1px solid rgba(242,234,218,.18);border-radius:10px;padding:12px 14px;text-align:center;}
.full-moon-name .fn{font-family:var(--display-font);font-size:17px;color:var(--moon);}
.full-moon-name .fe{font-family:'IM Fell English',serif;font-style:italic;font-size:12px;color:var(--dim);margin-top:2px;}
.full-moon-name .fd{font-size:11px;color:var(--text);margin-top:8px;line-height:1.7;}
.flow-wrap{padding:0 16px 14px;}
.flow-track{height:3px;background:rgba(255,255,255,.06);border-radius:2px;margin:8px 0;}
.flow-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#1a3a6a,var(--gold));transition:.5s;}
.flow-labels{display:flex;justify-content:space-between;}
.fl{font-size:9px;color:var(--dim);text-align:center;}
.fl.on{color:var(--gold);}
.personal-card{background:linear-gradient(135deg,rgba(74,148,104,.1),rgba(120,88,168,.08));border:1px solid rgba(74,148,104,.3);border-radius:12px;padding:14px;margin-bottom:8px;}
.personal-card .pc-title{font-family:var(--display-font);font-size:13px;color:var(--green-l);margin-bottom:6px;}
.personal-card .pc-body{font-size:11px;color:var(--text);line-height:1.8;}
.compat-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.compat-badge{font-size:10px;padding:3px 10px;border-radius:20px;background:rgba(74,148,104,.15);color:var(--green-l);border:1px solid rgba(74,148,104,.25);}

/* ══ 設定ページ ══ */
.settings-page{padding:20px 14px;}
.settings-title{font-family:var(--display-font);font-size:20px;color:var(--moon);margin-bottom:4px;}
.settings-sub{font-size:11px;color:var(--dim);margin-bottom:20px;line-height:1.6;}
.form-section{margin-bottom:22px;}
.form-section-title{font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;color:var(--dim);margin-bottom:6px;display:block;letter-spacing:1px;}
.form-input{width:100%;background:rgba(11,16,24,.8);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--moon);font-size:14px;font-family:var(--body-font);outline:none;-webkit-appearance:none;appearance:none;transition:.2s;}
.form-input:focus{border-color:var(--gold);}
.form-input option{background:#0b1018;color:var(--moon);}
.save-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--bg);font-size:15px;font-family:var(--display-font);letter-spacing:2px;cursor:pointer;transition:.2s;margin-top:8px;}
.save-btn:active{opacity:.8;transform:scale(.98);}

/* プロフィールカード */
.profile-card{background:linear-gradient(135deg,rgba(16,24,37,.95),rgba(10,16,24,.95));border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:20px;}
.profile-header{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.profile-avatar{width:52px;height:52px;border-radius:50%;background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.3);display:flex;align-items:center;justify-content:center;font-size:26px;}
.profile-name{font-family:var(--display-font);font-size:18px;color:var(--moon);}
.profile-date{font-size:11px;color:var(--dim);margin-top:2px;}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.profile-item{background:rgba(8,12,20,.6);border:1px solid var(--border);border-radius:10px;padding:10px;}
.profile-item .pi-label{font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:4px;}
.profile-item .pi-val{font-size:13px;color:var(--moon);}
.profile-item .pi-sub{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.4;}

/* テーマグリッド */
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
.theme-btn{
  border-radius:10px;padding:10px 6px;border:1px solid var(--border);
  cursor:pointer;text-align:center;transition:.2s;
  font-size:10px;background:rgba(11,16,24,.6);color:var(--text);
  font-family:var(--body-font);
}
.theme-btn:active{transform:scale(.96);}
.theme-btn.active{border-color:var(--gold);box-shadow:0 0 8px rgba(200,168,75,.2);}
.theme-btn .tb-icon{font-size:20px;display:block;margin-bottom:4px;}
.theme-btn .tb-label{font-size:9px;color:var(--dim);}
.theme-btn .tb-lock{font-size:8px;color:var(--red-l);}

/* フォントグリッド */
.font-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.font-btn{border-radius:10px;padding:10px 6px;border:1px solid var(--border);cursor:pointer;text-align:center;transition:.2s;background:rgba(11,16,24,.6);color:var(--text);font-size:12px;}
.font-btn:active{transform:scale(.96);}
.font-btn.active{border-color:var(--gold);}
.font-btn .fb-preview{font-size:16px;display:block;margin-bottom:4px;color:var(--moon);}
.font-btn .fb-label{font-size:9px;color:var(--dim);}

/* 表示カスタマイズ */
.toggle-list{display:flex;flex-direction:column;gap:6px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(11,16,24,.6);border:1px solid var(--border);border-radius:10px;}
.toggle-label{font-size:12px;color:var(--text);}
.toggle-sub{font-size:10px;color:var(--dim);margin-top:1px;}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:rgba(255,255,255,.1);border-radius:11px;cursor:pointer;transition:.3s;}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;background:var(--dim);border-radius:50%;transition:.3s;}
.toggle input:checked+.toggle-slider{background:rgba(200,168,75,.4);}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px);background:var(--gold);}

/* ボトムナビ */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(6,9,15,.96);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 max(12px,env(safe-area-inset-bottom));backdrop-filter:blur(12px);z-index:100;}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:9px;letter-spacing:1px;cursor:pointer;padding:2px 16px;border-radius:8px;}
.ni.on{color:var(--gold);}
.ni .ico{font-size:19px;}

/* トースト */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(200,168,75,.9);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:12px;z-index:200;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
</style>

<script>
// ════════════════════════════════════
// 星空
// ════════════════════════════════════
const cv=document.getElementById('stars'),cx=cv.getContext('2d');
let stars=[];
function initStars(){
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  stars=Array.from({length:150},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.4+.2,phase:Math.random()*Math.PI*2,speed:Math.random()*.004+.001}));
}
function drawStars(t){
  cx.clearRect(0,0,cv.width,cv.height);
  stars.forEach(s=>{const a=.15+.7*Math.sin(t*s.speed+s.phase);cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fillStyle=`rgba(200,210,230,${a})`;cx.fill();});
  requestAnimationFrame(drawStars);
}
initStars();requestAnimationFrame(drawStars);
window.addEventListener('resize',initStars);

// ════════════════════════════════════
// PWA
// ════════════════════════════════════
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});

// ユーティリティ
// ════════════════════════════════════
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('on'));
  document.getElementById('ni-'+id)?.classList.add('on');
  if(id==='settings'){renderProfileDisplay();renderThemeGrid();renderFontGrid();renderToggleList();}
}
function goToday(){const t=new Date();vY=t.getFullYear();vM=t.getMonth()+1;selD=t.getDate();selY=vY;selM=vM;showPage('cal');render();setTimeout(()=>document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'nearest'}),100);}

// ════════════════════════════════════
// 設定ストア
// ════════════════════════════════════
const DEFAULTS={
  theme:'night', font:'elegant',
  showMoonIcon:true, showKyureki:true, showRokuyo:true,
  showIchiryu:true, showTensya:true, showTora:true, showMi:true,

  showGateArrow:true, showGateCell:true, showAstro:true,
  showMaya:true, showMayaKw:true,
};
function getSettings(){try{return Object.assign({},DEFAULTS,JSON.parse(localStorage.getItem('cosmic_settings')||'{}'));}catch{return DEFAULTS;}}
function saveSetting(k,v){const s=getSettings();s[k]=v;localStorage.setItem('cosmic_settings',JSON.stringify(s));render();}
function loadProfile(){try{return JSON.parse(localStorage.getItem('cosmic_profile'));}catch{return null;}}

// ════════════════════════════════════
// テーマ・フォント
// ════════════════════════════════════
const THEMES=[
  {id:'night',icon:'🌌',label:'夜空',free:true},
  {id:'white',icon:'☀️',label:'白夜',free:true},
  {id:'sumi',icon:'🖌️',label:'墨絵',free:true},
  {id:'sakura',icon:'🌸',label:'桜',free:false},
  {id:'umi',icon:'🌊',label:'海',free:false},
  {id:'ajisai',icon:'💠',label:'紫陽花',free:false},
  {id:'koyo',icon:'🍁',label:'紅葉',free:false},
  {id:'yuki',icon:'❄️',label:'雪',free:false},
  {id:'uchu',icon:'🔮',label:'宇宙',free:false},
  {id:'anime',icon:'⚡',label:'アニメ',free:false},
  {id:'pop',icon:'🎊',label:'ポップ',free:false},
  {id:'mizutama',icon:'🫧',label:'水玉',free:false},
];

  {id:'modern',label:'モダン',preview:'◎'},
  {id:'wa',label:'和風',preview:'月'},
];
function applyTheme(id){
  document.documentElement.setAttribute('data-theme',id==='night'?'':id);
}
function applyFont(id){
  document.documentElement.setAttribute('data-font',id==='elegant'?'':id);
}
function renderThemeGrid(){
  const s=getSettings();
  document.getElementById('themeGrid').innerHTML=THEMES.map(t=>`
    <div class="theme-btn${s.theme===t.id?' active':''}" onclick="selectTheme('${t.id}','${t.free}')">
      <span class="tb-icon">${t.icon}</span>
      <span class="tb-label">${t.label}</span>
      ${!t.free?'<span class="tb-lock">🔒 準備中</span>':''}
    </div>`).join('');
}
function selectTheme(id,free){
  if(free==='false'){showToast('🔒 プレミアム機能（準備中）');return;}
  const s=getSettings();s.theme=id;localStorage.setItem('cosmic_settings',JSON.stringify(s));
  applyTheme(id);renderThemeGrid();showToast('✦ テーマを変更しました');
}
function renderFontGrid(){
  const s=getSettings();
  document.getElementById('fontGrid').innerHTML=FONTS.map(f=>`
    <div class="font-btn${s.font===f.id?' active':''}" onclick="selectFont('${f.id}')" style="font-family:${f.id==='elegant'?'Cinzel,serif':f.id==='modern'?'M PLUS Rounded 1c,sans-serif':'Kaisei Decol,serif'}">
      <span class="fb-preview">${f.preview}</span>
      <span class="fb-label">${f.label}</span>
    </div>`).join('');
}
function selectFont(id){
  const s=getSettings();s.font=id;localStorage.setItem('cosmic_settings',JSON.stringify(s));
  applyFont(id);renderFontGrid();showToast('✦ フォントを変更しました');
}

function renderToggleList(){
  const s=getSettings();

    <div class="toggle-row">
      <div><div class="toggle-label">${t.label}</div><div class="toggle-sub">${t.sub}</div></div>
      <label class="toggle">
        <input type="checkbox" ${s[t.key]?'checked':''} onchange="saveSetting('${t.key}',this.checked)">
        <span class="toggle-slider"></span>
      </label>
    </div>`).join('');
}
function renderProfileDisplay(){
  const p=loadProfile();
  const el=document.getElementById('profileDisplay');
  if(!p){el.innerHTML='';return;}
  const bd=new Date(p.birth);
  const ks=getKyuseiYear(bd);
  const tz=getTzolkin(bd);
  const mn=getMoonPhase(getMoonAge(bd));
  el.innerHTML=`
  <div class="profile-card">
    <div class="profile-header">
      <div class="profile-avatar">${mn.icon}</div>
      <div><div class="profile-name">${p.name}</div><div class="profile-date">${p.birth} 生まれ</div></div>
    </div>
    <div class="profile-grid">
      <div class="profile-item"><div class="pi-label">本命星</div><div class="pi-val">${ks.name}</div><div class="pi-sub">${ks.desc}</div></div>
      <div class="profile-item"><div class="pi-label">生まれの月相</div><div class="pi-val">${mn.icon} ${mn.name}</div><div class="pi-sub">魂の原型</div></div>

  document.getElementById('inputName').value=p.name||'';

function saveProfile(){
  const name=document.getElementById('inputName').value.trim();
  const birth=document.getElementById('inputBirth').value;
  const time=document.getElementById('inputTime').value;
  if(!name){showToast('お名前を入力してください');return;}
  if(!birth){showToast('生年月日を入力してください');return;}
  localStorage.setItem('cosmic_profile',JSON.stringify({name,birth,time}));
  showToast(`✦ ${name}さんのプロフィールを保存しました`);
  renderProfileDisplay();
  setTimeout(()=>{showPage('cal');render();},1200);
}

function getRokuyo(y,m,d){const base=new Date(2024,0,11);const diff=Math.round((new Date(y,m-1,d)-base)/86400000);return ROKUYO[((diff%6)+6)%6];}
function getMoonAge(date){const base=new Date(2000,0,6,18,14);let age=((date-base)/86400000)%29.53059;return age<0?age+29.53059:age;}
function getMoonPhase(age){if(age<1.5)return{icon:'🌑',name:'新月',key:'new'};if(age<6.5)return{icon:'🌒',name:'三日月',key:'waxc'};if(age<8.5)return{icon:'🌓',name:'上弦の月',key:'fq'};if(age<13.5)return{icon:'🌔',name:'十三夜',key:'waxg'};if(age<16.5)return{icon:'🌕',name:'満月',key:'full'};if(age<21.5)return{icon:'🌖',name:'十六夜',key:'wang'};if(age<23.5)return{icon:'🌗',name:'下弦の月',key:'lq'};return{icon:'🌘',name:'晦日月',key:'wanc'};}
function getKyusei(dt){const base=new Date(2000,0,7);const diff=Math.floor((dt-base)/86400000);const idx=((diff%9)+9)%9;return{name:KS_NAME[idx],desc:KS_DESC[idx],doTxt:KS_DO[idx],dontTxt:KS_DONT[idx]};}
function getKyuseiYear(dt){const y=dt.getFullYear();const idx=((((y-2000)%9)+9)%9);return{name:KS_NAME[idx],desc:KS_DESC[idx]};}
function getTzolkin(date){const base=new Date(2020,7,1);const diff=Math.floor((date-base)/86400000);const pos=((diff%260)+260)%260;const seal=TZOLKIN_SEALS[pos%20];const tone=TZOLKIN_TONES[pos%13];return{seal,tone,pos,kw:TZOLKIN_KW[seal]||''};}
function getMoon13(date){const base=new Date(2025,6,26);const diff=Math.floor((date-base)/86400000);const dayOfYear=((diff%364)+364)%364;if(dayOfYear>=364)return{moonName:'時間外の日',day:1,kw:''};const idx=Math.floor(dayOfYear/28);return{moonName:MOON13_NAMES[idx]||'宇宙の月',day:(dayOfYear%28)+1,kw:MOON13_KW[idx]||''};}
function getToraDays(y,m){const base=new Date(2026,0,7);const r=[];const days=new Date(y,m,0).getDate();for(let d=1;d<=days;d++){const diff=Math.round((new Date(y,m-1,d)-base)/86400000);if(diff>=0&&diff%12===0)r.push(d);}return r;}
function getMiDays(y,m){const base=new Date(2026,0,9);const r=[];const days=new Date(y,m,0).getDate();for(let d=1;d<=days;d++){const diff=Math.round((new Date(y,m-1,d)-base)/86400000);if(diff>=0&&diff%12===0)r.push(d);}return r;}
function getActiveGate(y,m,d){for(const g of GATES){const s=g.start,e=g.end;if((m>s.m||(m===s.m&&d>=s.d))&&(m<e.m||(m===e.m&&d<=e.d)))return g;}return null;}
function isPeakDay(y,m,d){return GATES.some(g=>g.peak.m===m&&g.peak.d===d);}
function getAstroEvent(y,m,d){return ASTRO_EVENTS[`${y}-${m}-${d}`]||null;}
function getLifeNumber(dateStr){const digits=dateStr.replace(/-/g,'').split('').map(Number);let sum=digits.reduce((a,b)=>a+b,0);while(sum>9&&sum!==11&&sum!==22&&sum!==33)sum=[...String(sum)].map(Number).reduce((a,b)=>a+b,0);return sum;}

// 旧暦計算（簡易近似）
function getKyurekiDay(y,m,d){
  // 朔（新月）の日を基準に旧暦1日を算出
  const age=getMoonAge(new Date(y,m-1,d));
  // 現在の旧暦月の1日を逆算
  const dayOfMonth=Math.floor(age)+1;
  return dayOfMonth>30?1:dayOfMonth;
}

function getPersonalReading(dt,profile){
  if(!profile)return null;
  const bd=new Date(profile.birth);
  const dayKs=getKyusei(dt);const birthKs=getKyuseiYear(bd);
  const dayTz=getTzolkin(dt);const birthTz=getTzolkin(bd);
  const lifeNum=getLifeNumber(profile.birth);
  const dayPh=getMoonPhase(getMoonAge(dt));const birthPh=getMoonPhase(getMoonAge(bd));
  const msgs=[];
  if(dayPh.key===birthPh.key)msgs.push('生まれの月相と一致。魂が共鳴する特別な日。');
  else if(dayPh.key==='full')msgs.push('満月があなたの感情と直感を解放する。');
  else if(dayPh.key==='new')msgs.push('新月があなたの新しいサイクルを呼び起こす。');
  const di=KS_NAME.indexOf(dayKs.name),bi=KS_NAME.indexOf(birthKs.name),diff=Math.abs(di-bi);
  if(diff===0)msgs.push('本命星と一致。本来の力が最大に発揮できる日。');
  else if(diff===4||diff===5)msgs.push('本命星と対角。変革と飛躍のチャンスが訪れる日。');
  else if(diff<=2)msgs.push('本命星と調和。流れに乗って動くと吉。');
  if(dayTz.seal===birthTz.seal)msgs.push(`あなたの紋章「${birthTz.seal}」の日。本来の自分で輝ける。`);
  else if(dayTz.tone===birthTz.tone)msgs.push(`生まれの音「${birthTz.tone}」と共鳴。直感が冴える。`);
  const lm={1:'リーダーシップを発揮して。あなたの判断が今日の鍵。',2:'調和とパートナーシップの日。誰かと組むと良い結果が生まれる。',3:'創造性と表現の日。アイデアを外に出して。',4:'基盤を固める日。コツコツとした努力が実る。',5:'自由と冒険の日。新しい体験が扉を開く。',6:'愛情・責任の日。大切な人を思いやって。',7:'内省と分析の日。答えは内側にある。',8:'豊かさと達成の日。ビジネスに積極的に動いて。',9:'完成と奉仕の日。感謝が次の扉を開く。',11:'直感と啓示の日。スピリチュアルな洞察を信じて。',22:'大きなビジョンを描く日。長期的な計画が吉。',33:'愛と奉仕の日。誰かのために動くことで運が開く。'};
  if(lm[lifeNum])msgs.push(lm[lifeNum]);
  return{name:profile.name,birthKs:birthKs.name,birthTz:birthTz.seal,lifeNum,msgs};
}

const today=new Date();

// レンダリング
// ════════════════════════════════════
function render(){
  const s=getSettings();
  document.getElementById('mLabel').textContent=`${vM}月 · ${MONTHS[vM-1]}`;
  document.getElementById('yLabel').textContent=`${vY}`;
  updateBanner();

  // ゲートバナー
  const gb=document.getElementById('gateBanner');
  const todayGate=getActiveGate(today.getFullYear(),today.getMonth()+1,today.getDate());
  if(s.showGateBanner&&todayGate){
    const isPeak=isPeakDay(today.getFullYear(),today.getMonth()+1,today.getDate());
    gb.innerHTML=`<div class="gate-banner"><div class="gate-icon">${todayGate.icon}</div><div class="gate-info"><b>${todayGate.name}${isPeak?' ✦ ピーク':'　開催中'}</b><span>${isPeak?todayGate.peak_desc:todayGate.desc}</span></div></div>`;
  } else gb.innerHTML='';

  // ゲート矢印バー（表示月にゲートがある場合）
  const gab=document.getElementById('gateArrowBar');
  const monthGates=GATES.filter(g=>{
    const sm=g.start.m,em=g.end.m;
    return vM>=sm&&vM<=em||(sm===vM||em===vM);
  });
  if(s.showGateArrow&&monthGates.length>0){
    gab.innerHTML=monthGates.map(g=>{
      const sd=g.start.m===vM?g.start.d:1;
      const ed=g.end.m===vM?g.end.d:new Date(vY,vM,0).getDate();
      const pd=g.peak.m===vM?`${g.peak.d}日ピーク`:'';
      return `<div class="gate-arrow-bar">
        <div class="gab-arrow">${g.icon}</div>
        <div class="gab-dates">${sd}日</div>
        <div class="gab-line">${pd?`<div class="gab-peak">✦${pd}</div>`:''}</div>
        <div class="gab-dates">${ed}日</div>
        <div style="font-size:11px;color:var(--dim);margin-left:4px;">${g.name}</div>
      </div>`;
    }).join('');
  } else gab.innerHTML='';

  // グリッド
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const firstDay=new Date(vY,vM-1,1).getDay();
  const daysInM=new Date(vY,vM,0).getDate();
  const ichList=ICHIRYU[vM]||[],funaList=FUNASOJI[vM]||[],sanList=SANRINBO[vM]||[];
  const toraList=getToraDays(vY,vM),miList=getMiDays(vY,vM);
  const tensyaD=TENSYA[vM]||-1;

  for(let i=0;i<firstDay;i++){const b=document.createElement('div');b.className='dc empty';grid.appendChild(b);}

  for(let d=1;d<=daysInM;d++){
    const dt=new Date(vY,vM-1,d);
    const age=getMoonAge(dt);
    const phase=getMoonPhase(age);
    const isToday=(d===today.getDate()&&vM===today.getMonth()+1&&vY===today.getFullYear());
    const isSel=(d===selD&&vM===selM&&vY===selY);
    const gate=getActiveGate(vY,vM,d);
    const pDay=isPeakDay(vY,vM,d);
    const astro=getAstroEvent(vY,vM,d);
    const kyureki=getKyurekiDay(vY,vM,d);

    const cell=document.createElement('div');
    let cls='dc';
    if(isToday)cls+=' today';
    if(isSel)cls+=' selected';
    if(s.showGateCell&&gate&&!pDay)cls+=' gate-day';
    if(pDay&&s.showGateCell)cls+=' peak-day';
    cell.className=cls;

    // 日数
    const dn=document.createElement('div');dn.className='dn';dn.textContent=d;cell.appendChild(dn);

    // 旧暦
    if(s.showKyureki){
      const kr=document.createElement('div');kr.className='kyureki';
      kr.textContent=`旧${kyureki}`;cell.appendChild(kr);
    }

    // 月相アイコン
    if(s.showMoonIcon){
      const mi=document.createElement('div');
      const isMainPhase=['new','fq','full','lq'].includes(phase.key);
      const isNearPhase=['waxc','waxg','wang','wanc'].includes(phase.key);
      if(isMainPhase){mi.className='moon-sm';mi.textContent=phase.icon;}
      else if(isNearPhase){mi.className='moon-sm near';mi.textContent=phase.icon;}
      else{mi.className='moon-sm dim';mi.textContent='·';}
      cell.appendChild(mi);
    }

    // タグ
    const tags=document.createElement('div');tags.className='tags';
    const rk=getRokuyo(vY,vM,d);
    if(s.showRokuyo&&(rk==='大安'||rk==='仏滅')){
      tags.innerHTML+=`<span class="tg ${rk==='大安'?'tg-g':'tg-r'}">${rk}</span>`;
    }
    if(s.showTensya&&d===tensyaD)tags.innerHTML+=`<span class="tg tg-g">天赦</span>`;
    if(s.showIchiryu&&ichList.includes(d))tags.innerHTML+=`<span class="tg tg-g">一粒</span>`;
    if(s.showTora&&toraList.includes(d))tags.innerHTML+=`<span class="tg tg-gr">寅</span>`;
    if(s.showMi&&miList.includes(d))tags.innerHTML+=`<span class="tg tg-gr">巳</span>`;
    if(s.showFunasoji&&funaList.includes(d))tags.innerHTML+=`<span class="tg tg-r">不成</span>`;
    if(s.showSanrinbo&&sanList.includes(d))tags.innerHTML+=`<span class="tg tg-r">三隣</span>`;
    if(s.showAstro&&astro)tags.innerHTML+=`<span class="tg tg-b">${astro.icon}</span>`;
    if(pDay&&s.showGateCell)tags.innerHTML+=`<span class="tg tg-p">✦峰</span>`;
    cell.appendChild(tags);

    cell.onclick=()=>{selD=d;selY=vY;selM=vM;render();setTimeout(()=>document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'nearest'}),50);};
    grid.appendChild(cell);
  }

  updatePanel(new Date(selY,selM-1,selD));
}

function updateBanner(){
  const dt=new Date();const age=getMoonAge(dt);const ph=getMoonPhase(age);
  document.getElementById('bIcon').textContent=ph.icon;
  document.getElementById('bName').textContent=ph.name;
  document.getElementById('bAge').textContent=Math.floor(age);
  const mn=FULL_MOON_NAMES[dt.getMonth()+1];
  let desc=age<14.8?`満月まであと${Math.ceil(14.8-age)}日`:`新月まであと${Math.ceil(29.5-age)}日`;
  if(ph.key==='full'&&mn)document.getElementById('bDesc').innerHTML=`${mn.jp} · ${mn.en}<br>${desc}`;
  else document.getElementById('bDesc').textContent=desc;
}

  const toraList=getToraDays(y,m),miList=getMiDays(y,m);
  const tensyaD=TENSYA[m]||-1;
  const gate=getActiveGate(y,m,d);const isPeak=isPeakDay(y,m,d);
  const astro=getAstroEvent(y,m,d);const phInfo=MOON_PHASE_INFO[ph.key];
  const mn=FULL_MOON_NAMES[m];
  const kyureki=getKyurekiDay(y,m,d);
  const dw=['日','月','火','水','木','金','土'][dt.getDay()];
  const profile=loadProfile();
  const personal=getPersonalReading(dt,profile);

  let gs=0,bs=0;
  if(d===tensyaD)gs+=3;if(ichList.includes(d))gs+=2;if(toraList.includes(d))gs+=1;if(miList.includes(d))gs+=1;
  if(rk==='大安')gs+=2;if(rk==='友引')gs+=1;if(isPeak)gs+=3;
  if(funaList.includes(d))bs+=2;if(sanList.includes(d))bs+=1;if(rk==='仏滅')bs+=2;if(rk==='赤口')bs+=1;
  const score=Math.max(0,Math.min(10,5+gs-bs));
  const dots=Array.from({length:10},(_,i)=>`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 2px;background:${i<score?'var(--gold)':'rgba(255,255,255,.1)'};"></span>`).join('');

  let fp=0,fi=0;
  if(age<7.4){fi=0;fp=age/7.4*25;}else if(age<14.8){fi=1;fp=25+(age-7.4)/7.4*25;}else if(age<22.1){fi=2;fp=50+(age-14.8)/7.3*25;}else{fi=3;fp=75+(age-22.1)/7.4*25;}
  const flabs=['🌑種まき期','🌓行動期','🌕開花期','🌗手放し期'];

  let html=`<div class="panel-head">
    <div>
      <div class="panel-date">${m}/${d}（${dw}）</div>
      <div class="panel-date-sub">${y}年 · 旧暦${kyureki}日 · 月齢${age.toFixed(1)}</div>
    </div>
    <div class="panel-moon">${ph.icon}</div>
    <div class="panel-moon-info"><div class="mn">${ph.name}</div><div class="ma">月齢 ${age.toFixed(1)}</div></div>
  </div>`;

  // 個人リーディング
  if(personal){
    html+=`<div class="psec"><div class="psec-label">✦ ${personal.name}さんへのメッセージ</div>
    <div class="personal-card"><div class="pc-title">今日の個人リーディング</div>
    <div class="pc-body">${personal.msgs.map(m=>`• ${m}`).join('<br>')}</div>
    <div class="compat-row">
      <span class="compat-badge">本命星：${personal.birthKs}</span>
      <span class="compat-badge">紋章：${personal.birthTz}</span>
      <span class="compat-badge">ライフパス：${personal.lifeNum}</span>
    </div></div></div>`;
  } else {
    html+=`<div class="psec"><div class="psec-label">✦ 個人リーディング</div>
    <div style="font-size:11px;color:var(--dim);line-height:1.7;">「設定」から誕生日を登録すると<br>あなただけの宇宙メッセージが届きます。</div></div>`;
  }

  // スコア
  html+=`<div class="psec"><div class="psec-label">Energy Score</div><div style="margin-bottom:6px;">${dots}</div>
  <div style="font-size:11px;color:var(--dim);">${gs>bs?'✦ 吉日。積極的に動くと良い':gs===bs?'バランスの日。慎重に':'注意日。ゆっくり過ごすのが吉'}</div></div>`;

  // マヤ暦
  if(s.showMaya){
    html+=`<div class="psec"><div class="psec-label">Maya Calendar</div><div class="maya-row">
    <div class="maya-card"><div class="mi">🌀</div><div class="ml">TZOLKIN</div>
    <div class="mv">${tz.seal}<br><span style="font-size:10px;color:var(--dim);">音${(tz.pos%13)+1}・${tz.tone}</span></div>
    ${s.showMayaKw?`<div class="mk">🔑 ${tz.kw}</div>`:''}
    </div>
    <div class="maya-card"><div class="mi">🌙</div><div class="ml">13 MOONS</div>
    <div class="mv">${m13.moonName}<br><span style="font-size:10px;color:var(--dim);">${m13.day}日目</span></div>
    ${s.showMayaKw?`<div class="mk">🔑 ${m13.kw}</div>`:''}
    </div></div></div>`;
  }

  // 満月の名前
  if(ph.key==='full'&&mn){
    html+=`<div class="psec"><div class="psec-label">Full Moon</div>
    <div class="full-moon-name"><div class="fn">${mn.jp}</div><div class="fe">${mn.en}</div><div class="fd">${mn.desc}</div></div></div>`;
  }

  // 吉凶カード
  const cards=[];
  if(phInfo)cards.push({type:['full','new'].includes(ph.key)?'good':'neutral',icon:ph.icon,name:ph.name+(ph.key==='full'&&mn?` — ${mn.jp}`:''),desc:phInfo.desc,dos:phInfo.do,donts:phInfo.dont});
  if(d===tensyaD)cards.push({type:'good',icon:'✨',name:'天赦日 — 最強の吉日',desc:'天がすべての罪を赦す年に6回の最強吉日。何を始めても天の後押しが得られる。',dos:['新しいことを始める','財布の新調','神社参拝','契約・投資'],donts:['何もせず無駄に過ごす']});
  if(ichList.includes(d))cards.push({type:'good',icon:'🌾',name:'一粒万倍日',desc:'一粒の種が万倍になる吉日。財布の新調・種まき・新規開業に最適。',dos:['新規ビジネス・口座開設','財布新調','種まき','人に奢る'],donts:['借金（万倍になる）','悪いことを始める']});
  if(toraList.includes(d))cards.push({type:'good',icon:'🐯',name:'寅の日 — 金運の日',desc:'出て行ったものが戻ってくる。金運・旅行・出発に吉。',dos:['旅行の出発','財布の購入','お金を出すこと'],donts:['葬儀・弔事']});
  if(miList.includes(d))cards.push({type:'good',icon:'🐍',name:'巳の日 — 弁財天縁日',desc:'弁財天の使いである蛇の日。金運・財運・芸能のエネルギーが高まる。',dos:['弁財天・神社参拝','金融機関の手続き','芸術活動'],donts:['浪費・散財']});
  if(s.showRokuyo)cards.push({type:rkInfo.good===true?'good':rkInfo.good===false?'caution':'neutral',icon:rk==='大安'?'🎊':rk==='仏滅'?'🚫':rk==='友引'?'🤝':'⚖',name:`六曜 — ${rk}`,desc:rkInfo.desc,dos:rkInfo.do,donts:rkInfo.dont||[]});
  if(funaList.includes(d))cards.push({type:'caution',icon:'⚠️',name:'不成就日',desc:'何事も成就しない凶日。物事が成立しにくい。',dos:['現状維持','内省・計画立案'],donts:['新規契約','結婚・入籍','大きな投資']});
  if(sanList.includes(d))cards.push({type:'caution',icon:'🔨',name:'三隣亡',desc:'建築・引越しの大凶日。近隣三軒を滅ぼすとされる。',dos:['現状維持','静かに過ごす'],donts:['建築開始','引越し','大規模工事']});
  if(gate)cards.push({type:'gate',icon:gate.icon,name:`${gate.name}${isPeak?' ✦ ピークデイ':''}`,desc:isPeak?gate.peak_desc:gate.desc,dos:gate.do,donts:gate.dont});
  if(astro&&s.showAstro)cards.push({type:'astro',icon:astro.icon,name:astro.name,desc:astro.desc,dos:['節目の儀式・意図設定'],donts:[]});
  cards.push({type:'neutral',icon:'⭐',name:`九星気学 — ${ks.name}`,desc:ks.desc,dos:[ks.doTxt],donts:[ks.dontTxt]});

  html+=`<div class="psec"><div class="psec-label">Day Reading</div><div class="day-cards">`;
  cards.forEach(c=>{
    html+=`<div class="day-card ${c.type}"><div class="dc-icon">${c.icon}</div><div class="dc-body">
    <div class="dc-name">${c.name}</div><div class="dc-desc">${c.desc}</div><div class="dc-actions">`;
    (c.dos||[]).forEach(a=>{html+=`<div class="dc-do">${a}</div>`;});
    (c.donts||[]).forEach(a=>{html+=`<div class="dc-dont">${a}</div>`;});
    html+=`</div></div></div>`;
  });
  html+=`</div></div>`;

  html+=`<div class="flow-wrap"><div style="font-size:9px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;margin-bottom:8px;">Monthly Flow</div>
  <div class="flow-track"><div class="flow-fill" style="width:${Math.min(fp,100)}%"></div></div>
  <div class="flow-labels">${flabs.map((l,i)=>`<div class="fl${i===fi?' on':''}">${l}</div>`).join('')}</div></div>`;

  document.getElementById('panel').innerHTML=html;
}

// ════════════════════════════════════
// 初期化
// ════════════════════════════════════
const initSettings=getSettings();
applyTheme(initSettings.theme);
applyFont(initSettings.font);
const saved=loadProfile();
if(saved){document.getElementById('inputName').value=saved.name||'';document.getElementById('inputBirth').value=saved.birth||'';document.getElementById('inputTime').value=saved.time||'';}
render();
</script>
</body>
</html>
